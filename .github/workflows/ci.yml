name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [python, harness]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        if: matrix.suite == 'python'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: System fonts for pygame SysFont
        if: matrix.suite == 'python'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Sync Python deps (locked)
        if: matrix.suite == 'python'
        run: uv sync --extra dev --frozen

      - name: Unit + harness tests
        if: matrix.suite == 'python'
        run: uv run pytest

      - name: Headless smoke
        if: matrix.suite == 'python'
        run: uv run python src/gauge_ui.py --smoke

      - name: Headless smoke (explicit --no-intro)
        if: matrix.suite == 'python'
        run: uv run python src/gauge_ui.py --smoke --no-intro

      - name: UI harness (ahash + frames)
        if: matrix.suite == 'python'
        run: uv run python scripts/ui_harness.py --check

      - name: E2E mock ESP32 pipe → smoke frames
        if: matrix.suite == 'python'
        run: |
          uv run python -m mocks.esp32_uart --count 25 --immediate --scenario drive \
            | uv run python src/gauge_ui.py --smoke --screenshot /tmp/e2e-shots
          uv run python -c "import os; assert sorted(os.listdir('/tmp/e2e-shots')) == [
            '01_sweep.png','02_ready.png','03_reveal.png','04_live.png','05_cruise.png'
          ]"

      - name: E2E unittest module
        if: matrix.suite == 'python'
        run: uv run pytest tests/test_e2e.py

      - name: Set up Node.js
        if: matrix.suite == 'harness'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/harness/package-lock.json

      - name: Install and test
        if: matrix.suite == 'harness'
        working-directory: apps/harness
        run: |
          npm ci
          npm test

      - name: Production build
        if: matrix.suite == 'harness'
        working-directory: apps/harness
        run: npm run build

  success:
    name: CI
    if: always()
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: All matrix jobs succeeded
        run: test "${{ needs.ci.result }}" = "success"
